<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 68" width="300" height="68">
  <defs>
    <radialGradient id="bodyGrad" cx="36%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#fcd878"/>
      <stop offset="42%"  stop-color="#e8920e"/>
      <stop offset="100%" stop-color="#8c4a00"/>
    </radialGradient>
    <radialGradient id="finGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#d98010"/>
      <stop offset="100%" stop-color="#7a3800" stop-opacity="0.75"/>
    </radialGradient>
    <clipPath id="bodyClip">
      <ellipse cx="31" cy="34" rx="22" ry="24"/>
    </clipPath>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Dorsal fin (top) ── -->
  <path d="M 13,13 C 17,1 31,-1 43,2 C 50,4 52,14 52,21"
        fill="url(#finGrad)" stroke="#7a3800" stroke-width="0.7" opacity="0.88"/>
  <!-- Dorsal fin rays -->
  <g opacity="0.18" stroke="white" stroke-width="0.9">
    <line x1="19" y1="34" x2="21" y2="5"/>
    <line x1="25" y1="34" x2="28" y2="2"/>
    <line x1="31" y1="34" x2="35" y2="1"/>
    <line x1="37" y1="34" x2="42" y2="3"/>
    <line x1="43" y1="34" x2="49" y2="11"/>
  </g>

  <!-- ── Anal fin (bottom mirror) ── -->
  <path d="M 13,55 C 17,67 31,69 43,66 C 50,64 52,54 52,47"
        fill="url(#finGrad)" stroke="#7a3800" stroke-width="0.7" opacity="0.88"/>
  <!-- Anal fin rays -->
  <g opacity="0.18" stroke="white" stroke-width="0.9">
    <line x1="19" y1="34" x2="21" y2="63"/>
    <line x1="25" y1="34" x2="28" y2="66"/>
    <line x1="31" y1="34" x2="35" y2="67"/>
    <line x1="37" y1="34" x2="42" y2="65"/>
    <line x1="43" y1="34" x2="49" y2="57"/>
  </g>

  <!-- ── Caudal (tail) fin ── -->
  <path d="M 52,20 C 58,22 65,28 65,34 C 65,40 58,46 52,48 C 56,40 57,34 56,34 C 57,34 56,28 52,20Z"
        fill="url(#finGrad)" stroke="#7a3800" stroke-width="0.7" opacity="0.9"/>

  <!-- ── Pectoral fin ── -->
  <path d="M 17,35 Q 23,45 30,42 Q 24,37 17,35Z"
        fill="rgba(160,80,0,0.45)" stroke="#7a3800" stroke-width="0.5"/>

  <!-- ── Body ── -->
  <ellipse cx="31" cy="34" rx="22" ry="24" fill="url(#bodyGrad)" filter="url(#glow)"/>

  <!-- ── Vertical bars clipped to body (9 bars, discus-style) ── -->
  <g clip-path="url(#bodyClip)">
    <!-- Eye bar (bar 1 — darkest) -->
    <rect x="11" y="9"  width="3.5" height="50" fill="rgba(30,12,0,0.55)"/>
    <!-- Bars 2–8 -->
    <rect x="17" y="9"  width="2.5" height="50" fill="rgba(30,12,0,0.22)"/>
    <rect x="22" y="9"  width="2.5" height="50" fill="rgba(30,12,0,0.2)"/>
    <rect x="27" y="9"  width="2.5" height="50" fill="rgba(30,12,0,0.2)"/>
    <rect x="32" y="9"  width="2.5" height="50" fill="rgba(30,12,0,0.2)"/>
    <rect x="37" y="9"  width="2.5" height="50" fill="rgba(30,12,0,0.2)"/>
    <rect x="42" y="9"  width="2.5" height="50" fill="rgba(30,12,0,0.2)"/>
    <rect x="47" y="9"  width="2.5" height="50" fill="rgba(30,12,0,0.22)"/>
  </g>

  <!-- ── Lateral line (faint) ── -->
  <line x1="10" y1="34" x2="53" y2="34" stroke="rgba(255,210,100,0.2)" stroke-width="1"/>

  <!-- ── Eye ── -->
  <circle cx="15" cy="27" r="5"   fill="#f5c830"/>
  <circle cx="15" cy="27" r="3.2" fill="#0d0500"/>
  <circle cx="13.4" cy="25.4" r="1.3" fill="white" opacity="0.85"/>
  <circle cx="15" cy="27" r="5"   fill="none" stroke="#7a3800" stroke-width="0.9"/>

  <!-- ── Mouth (small, upturned) ── -->
  <path d="M 8,34 Q 10,37 13,35" fill="none" stroke="#5a2800" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ── Gill line ── -->
  <path d="M 13,16 Q 9,34 13,52" fill="none" stroke="rgba(80,35,0,0.35)" stroke-width="1.5"/>

  <!-- ── Brand text ── -->
  <text x="80" y="29" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="21" fill="white" letter-spacing="0.3">Jack Wattley</text>
  <text x="81" y="53" font-family="'Segoe UI',Arial,sans-serif" font-weight="300" font-size="17" fill="rgba(255,216,90,0.96)" letter-spacing="7">DISCUS</text>
</svg>

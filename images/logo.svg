<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64">
  <defs>
    <radialGradient id="fishGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f9c74f"/>
      <stop offset="55%" stop-color="#e8960c"/>
      <stop offset="100%" stop-color="#b86d00"/>
    </radialGradient>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fish circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#fishGrad)" filter="url(#softglow)"/>

  <!-- Discus fish body (round disc shape) -->
  <ellipse cx="30" cy="32" rx="16" ry="20" fill="none" stroke="white" stroke-width="2.2" opacity="0.95"/>

  <!-- Dorsal fin (top) -->
  <path d="M22 14 C26 6 36 6 40 14" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Ventral fin (bottom) -->
  <path d="M22 50 C26 58 36 58 40 50" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Tail fin -->
  <path d="M46 22 Q62 32 46 42" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2" stroke-linejoin="round"/>

  <!-- Lateral stripe -->
  <line x1="14" y1="32" x2="46" y2="32" stroke="white" stroke-width="1.2" opacity="0.35"/>

  <!-- Eye -->
  <circle cx="21" cy="27" r="3.2" fill="white" opacity="0.95"/>
  <circle cx="21" cy="27" r="1.6" fill="#b86d00"/>
  <circle cx="20.2" cy="26.2" r="0.6" fill="white" opacity="0.8"/>

  <!-- Pectoral fin detail -->
  <path d="M30 32 Q34 24 44 28" fill="none" stroke="white" stroke-width="1.2" opacity="0.4"/>

  <!-- Brand text -->
  <text x="74" y="26" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" fill="white" letter-spacing="0.3">Jack Wattley</text>
  <text x="75" y="50" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="17" fill="rgba(255,220,100,0.95)" letter-spacing="7">DISCUS</text>
</svg>
